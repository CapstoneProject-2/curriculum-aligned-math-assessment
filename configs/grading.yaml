# 공개 기본 설정입니다. 비공개 파인튜닝 모델 식별자는 저장하지 않으며,
# 필요한 경우 각 실행 스크립트의 --model 인자로 전달합니다.
grading_conditions:
  # 기본 이진 채점 구현: 모델별_채점결과_생성.ipynb 21번 셀
  binary_v1:
    model: gpt-4o-mini
    temperature: 1.0
    max_tokens: 2000
  # 원샷 이진 채점 구현: grading_hint_langchain.py
  binary_v2:
    model: gpt-4o-mini
    temperature: 0.5
    max_tokens: 2000
  # 구조화된 부분점수 채점 구현: partial_scoring.py
  partial_credit_v2:
    model: gpt-4o-mini
    temperature: 0.7
    max_tokens: 3000
  # 수정 원고 작성 과정에서 추가한 제로샷 비교 조건
  partial_credit_v1:
    model: gpt-4o-mini
    temperature: 0.7
    max_tokens: 3000
rubric:
  # partial_scoring.py의 채점 기준 생성 기본값
  model: gpt-4o-mini
  temperature: 0.8
  max_tokens: 2000
judge:
  model: o4-mini
  temperature: 1.0
  max_completion_tokens: 5000
feedback:
  model: gpt-4o-mini
  temperature: 0.9
  max_tokens: 1000
evaluation:
  excluded_unit: 유리수와 순환소수
  expected_rows_after_exclusion: 360
